<script>
/* 画面の拡大を止める（2本指で広げる・2回タップ）。iPhone は上の指定だけだと無視することがあるので、2本指の動きも直接止める */
['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
</script>

<style>
/* カジノの緑のフェルトの上に、木と真鍮のホイールを1台。上にリストの切り替え、下に結果 */
:root {
  --felt: #145a43;
  --felt-deep: #072219;
  --wood: #4a2a13;
  --brass: #e3bd62;
  --brass-deep: #9c7426;
  --red: #b3202f;
  --black: #17181b;
  --green: #146b45;
  --ivory: #fbf8f1;
  --text: #eef5f0;
  --muted: #9dbfb0;
  --sheet: #10231c;
  --line: rgba(255,255,255,.1);
  --display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
  --caps: "Big Shoulders Display", "Arial Narrow", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: radial-gradient(110% 75% at 50% 42%, var(--felt) 0%, var(--felt-deep) 100%), var(--felt-deep);
  color: var(--text);
  font-family: var(--body);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
}
button { font: inherit; color: inherit; }
.app {
  height: 100%;
  max-width: 560px;
  margin: 0 auto;
  padding-inline: 16px;
  padding-block: calc(env(safe-area-inset-top, 0px) + 10px) calc(env(safe-area-inset-bottom, 0px) + 16px);
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.list-btn {
  display: flex; align-items: center; gap: 10px;
  min-height: 44px; min-width: 0;
  padding: 6px 14px 6px 16px;
  border-radius: 999px;
  border: 1px solid color-mix(in srgb, var(--brass) 45%, transparent);
  background: rgba(0,0,0,.3);
  cursor: pointer;
}
.list-btn small { font-family: var(--caps); font-weight: 700; letter-spacing: .18em; color: var(--brass); font-size: .75rem; }
.list-btn span { font-weight: 700; font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 48vw; }
.list-btn svg { width: 16px; height: 16px; flex-shrink: 0; color: var(--brass); }
.sound {
  width: 44px; height: 44px; flex-shrink: 0;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: rgba(0,0,0,.3);
  display: grid; place-items: center;
  cursor: pointer;
}
.sound svg { width: 22px; height: 22px; }
.sound .off { display: none; }
.sound[aria-pressed="false"] .on { display: none; }
.sound[aria-pressed="false"] .off { display: block; }
.sound[aria-pressed="false"] { color: var(--muted); }

.main { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 12px; }
.stage { width: 100%; height: min(calc(100vw - 32px), 528px); max-height: calc(100% - 8rem); min-height: 0; flex: 0 1 auto; display: grid; place-items: center; }
#wheel { touch-action: none; display: block; cursor: grab; }
#wheel:active { cursor: grabbing; }

.result { min-height: 5.4rem; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center; }
.result .eyebrow { font-family: var(--caps); font-weight: 700; letter-spacing: .3em; font-size: .8rem; color: var(--brass); }
.result .pick { display: flex; align-items: center; gap: 12px; max-width: 100%; }
.result .chip { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--brass); flex-shrink: 0; }
.result b { font-family: var(--display); font-weight: 400; font-size: clamp(1.6rem, 9vw, 2.6rem); line-height: 1.1; overflow-wrap: anywhere; text-shadow: 0 2px 0 rgba(0,0,0,.45); }
.result .msg { font-size: .95rem; color: var(--muted); }
.result.pop .pick { animation: pop .5s cubic-bezier(.2,1.4,.4,1); }
@keyframes pop { from { transform: scale(.5); opacity: 0; } to { transform: none; opacity: 1; } }
.hint { text-align: center; font-size: .8rem; color: var(--muted); min-height: 1.2em; }

/* リストの編集シート */
.backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 10; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 11;
  max-width: 560px; margin: 0 auto;
  max-height: 88dvh;
  overflow-y: auto;
  overscroll-behavior: contain;
  background: var(--sheet);
  border-top: 1px solid color-mix(in srgb, var(--brass) 40%, transparent);
  border-radius: 20px 20px 0 0;
  padding-inline: 16px;
  padding-block: 8px calc(env(safe-area-inset-bottom, 0px) + 20px);
  display: flex; flex-direction: column; gap: 14px;
  -webkit-user-select: text; user-select: text;
}
.grab { width: 40px; height: 5px; border-radius: 99px; background: var(--line); align-self: center; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; position: sticky; top: -8px; background: var(--sheet); padding-block: 6px; z-index: 1; }
.sheet h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 1.15rem; color: var(--brass); }
.sheet h3 { margin: 6px 0 0; font-size: .8rem; font-weight: 700; color: var(--muted); letter-spacing: .08em; }
.done { min-height: 44px; padding: 0 20px; border-radius: 999px; border: 0; background: var(--brass); color: #2a1a0c; font-weight: 700; cursor: pointer; }
.lists { display: flex; flex-direction: column; gap: 6px; }
.list-row {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  min-height: 48px; padding: 8px 14px;
  border-radius: 12px; border: 1px solid var(--line);
  background: rgba(255,255,255,.03);
  text-align: left; cursor: pointer;
}
.list-row[aria-current="true"] { border-color: var(--brass); background: color-mix(in srgb, var(--brass) 12%, transparent); }
.list-row span:first-child { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.list-row span:last-child { font-size: .8rem; color: var(--muted); flex-shrink: 0; }
.ghost { min-height: 44px; border-radius: 12px; border: 1px dashed color-mix(in srgb, var(--brass) 50%, transparent); background: transparent; color: var(--brass); font-weight: 700; cursor: pointer; }
.ghost:disabled { opacity: .4; cursor: default; }
.field { display: flex; flex-direction: column; gap: 6px; font-size: .8rem; color: var(--muted); }
input[type="text"] {
  font: inherit; font-size: 16px; color: var(--text);
  min-height: 44px; padding: 8px 12px; width: 100%; min-width: 0;
  border-radius: 10px; border: 1px solid var(--line); background: rgba(0,0,0,.3);
}
input[type="text"]:focus { outline: none; border-color: var(--brass); }
.items { display: flex; flex-direction: column; gap: 8px; }
.item { display: flex; align-items: center; gap: 8px; }
.item i { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; border: 1px solid rgba(255,255,255,.3); }
.del { width: 44px; height: 44px; flex-shrink: 0; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: var(--muted); font-size: 1.2rem; cursor: pointer; }
.danger { min-height: 44px; border-radius: 12px; border: 1px solid rgba(220,80,90,.5); background: transparent; color: #f0a0a8; font-weight: 700; cursor: pointer; }
.danger.armed { background: #8f1d2a; color: var(--ivory); border-color: transparent; }
.danger:disabled { opacity: .35; cursor: default; }
.note { font-size: .75rem; color: var(--muted); margin: 0; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--brass); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .result.pop .pick { animation: none; } }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <button class="list-btn" id="list-btn" type="button" aria-haspopup="dialog">
      <small>LIST</small><span id="list-label">昼ごはん</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <button class="sound" id="sound" type="button" aria-pressed="true" aria-label="音を消す">
      <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>
      <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
    </button>
  </div>

  <div class="main">
    <div class="stage" id="stage"><canvas id="wheel" aria-label="ルーレットのホイール。指ではじくと回る"></canvas></div>
    <div class="result" id="result" aria-live="polite"></div>
    <div class="hint" id="hint">ホイールを指ではじいて回す</div>
  </div>
</div>

<div class="backdrop" id="backdrop" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
  <div class="grab"></div>
  <div class="sheet-head">
    <h2 id="sheet-title">リスト</h2>
    <button class="done" id="done" type="button">できた</button>
  </div>
  <div class="lists" id="lists"></div>
  <button class="ghost" id="new-list" type="button">＋ 新しいリスト</button>

  <h3>このリストの中身</h3>
  <label class="field" for="name-input">リストの名前
    <input type="text" id="name-input" maxlength="20" autocomplete="off">
  </label>
  <div class="items" id="items"></div>
  <button class="ghost" id="add-item" type="button">＋ 選択肢を足す</button>
  <p class="note">選択肢は2〜12個。空の欄はホイールに出ない。書いた内容はこのスマホの中だけに残る。</p>
  <button class="danger" id="del-list" type="button">このリストを消す</button>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const TAU = Math.PI * 2;
  const MAX = 12;
  const COLORS = { red: '#b3202f', black: '#17181b', green: '#146b45' };
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  function rand01() {
    try { const u = new Uint32Array(1); crypto.getRandomValues(u); return u[0] / 4294967296; }
    catch (e) { return Math.random(); }
  }
  const randInt = n => Math.floor(rand01() * n);

  // ---------- 保存したリスト（このスマホの中だけ） ----------
  const KEY = 'roulette.v1';
  const uid = () => Math.random().toString(36).slice(2, 10);
  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(KEY));
      if (s && Array.isArray(s.lists) && s.lists.length) {
        if (!s.lists.some(l => l.id === s.current)) s.current = s.lists[0].id;
        return s;
      }
    } catch (e) {}
    const id = uid();
    return { lists: [{ id, name: '昼ごはん', items: ['ラーメン', 'カレー', '寿司', '牛丼', 'パスタ'] }], current: id };
  }
  const S = load();
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
  const cur = () => S.lists.find(l => l.id === S.current);
  const optionsOf = l => l.items.map(s => s.trim()).filter(Boolean).slice(0, MAX);
  const colorFor = (i, n) => (n % 2 === 1 && i === n - 1) ? COLORS.green : (i % 2 === 0 ? COLORS.red : COLORS.black);

  // ---------- 効果音（音声ファイルは使わず、その場で合成する） ----------
  const SFX = (() => {
    let ctx = null, master = null, nbuf = null, roll = null;
    let on = true;
    try { on = localStorage.getItem('roulette:sound') !== 'off'; } catch (e) {}
    function unlock() {   // iPhone は指で触れた瞬間にしか音の準備をさせてくれない
      if (!on) return;
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        ctx = new AC();
        master = ctx.createGain(); master.gain.value = 0.8; master.connect(ctx.destination);
        nbuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
        const ch = nbuf.getChannelData(0);
        for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
      }
      if (ctx.state === 'suspended') ctx.resume();
    }
    function env(t, vol, dur, attack = 0.004) {
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + attack);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      g.connect(master);
      return g;
    }
    function noise(t, dur, freq, q, vol, freqTo) {
      const s = ctx.createBufferSource(); s.buffer = nbuf;
      const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = q;
      f.frequency.setValueAtTime(freq, t);
      if (freqTo) f.frequency.exponentialRampToValueAtTime(freqTo, t + dur);
      s.connect(f).connect(env(t, vol, dur));
      s.start(t, Math.random()); s.stop(t + dur + 0.05);
    }
    function tone(t, freq, dur, type, vol, freqTo) {
      const o = ctx.createOscillator(); o.type = type;
      o.frequency.setValueAtTime(freq, t);
      if (freqTo) o.frequency.exponentialRampToValueAtTime(freqTo, t + dur);
      o.connect(env(t, vol, dur, 0.008));
      o.start(t); o.stop(t + dur + 0.05);
    }
    const ok = () => on && ctx;
    const now = () => ctx.currentTime + 0.01;
    return {
      unlock,
      get on() { return on; },
      set(v) {
        on = v;
        try { localStorage.setItem('roulette:sound', v ? 'on' : 'off'); } catch (e) {}
        if (v) unlock(); else { this.rollStop(); if (ctx) ctx.suspend(); }
      },
      whoosh() { if (ok()) noise(now(), 0.4, 500, 0.7, 0.3, 2600); },
      tick() { if (ok()) { const t = now(); tone(t, 1320, 0.07, 'sine', 0.12); tone(t + 0.06, 1760, 0.08, 'sine', 0.08); } },
      clack(vol) {    // 玉が仕切りに当たる「カラッ」
        if (!ok()) return;
        const t = now();
        noise(t, 0.03, 3200 + Math.random() * 1800, 2.2, vol);
        tone(t, 2100 + Math.random() * 900, 0.035, 'triangle', vol * 0.45);
      },
      land() {        // ポケットに落ちた「カチッ」
        if (!ok()) return;
        const t = now();
        noise(t, 0.04, 2800, 2, 0.55); tone(t, 1700, 0.05, 'triangle', 0.25);
        noise(t + 0.09, 0.03, 3400, 2, 0.3); noise(t, 0.12, 260, 1, 0.3);
      },
      win() {         // 決まった：上がっていくファンファーレ
        if (!ok()) return;
        const t = now();
        [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(t + i * 0.11, f, 0.28, 'triangle', 0.26));
        [523.25, 659.25, 783.99, 1046.5].forEach(f => { tone(t + 0.5, f, 1.3, 'triangle', 0.14); tone(t + 0.5, f, 1.0, 'square', 0.025); });
        for (let i = 0; i < 6; i++) noise(t + 0.5 + i * 0.07, 0.05, 5000, 2, 0.12);
      },
      rollStart() {   // 玉が溝を転がる「ゴロゴロ」（ずっと鳴らして、速さで大きさを変える）
        if (!ok() || roll) return;
        const s = ctx.createBufferSource(); s.buffer = nbuf; s.loop = true;
        const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 0.8; f.frequency.value = 1200;
        const g = ctx.createGain(); g.gain.value = 0;
        s.connect(f).connect(g).connect(master); s.start();
        roll = { s, f, g };
      },
      rollSet(level) {
        if (!roll || !ctx) return;
        const t = ctx.currentTime;
        roll.g.gain.setTargetAtTime(0.03 + level * 0.2, t, 0.06);
        roll.f.frequency.setTargetAtTime(500 + level * 1500, t, 0.06);
      },
      rollStop() {
        if (!roll || !ctx) { roll = null; return; }
        const r = roll; roll = null;
        r.g.gain.setTargetAtTime(0, ctx.currentTime, 0.08);
        r.s.stop(ctx.currentTime + 0.5);
      }
    };
  })();

  // ---------- ホイールの絵 ----------
  const cv = $('wheel'), ctx = cv.getContext('2d');
  let size = 0, R = 0, dpr = 1;
  let staticLayer = null, rotorLayer = null;
  let opts = [];
  let rot = 0;            // ホイール（回る部分）の角度
  let ballRel = null;     // 止まった玉の位置（ホイールに対する角度）
  let spin = null, drag = null, raf = 0;
  let winner = -1, winAt = 0;
  const DROP = 3.0;       // 最後に玉が跳ねる秒数
  const BOUNCES = 3.5;

  function layer() {
    const c = document.createElement('canvas');
    c.width = c.height = Math.round(size * dpr);
    const x = c.getContext('2d');
    x.scale(dpr, dpr); x.translate(size / 2, size / 2);
    return [c, x];
  }
  const ringPath = (x, ro, ri) => { x.beginPath(); x.arc(0, 0, ro, 0, TAU); x.arc(0, 0, ri, 0, TAU, true); };
  function goldGrad(x) {
    const g = x.createLinearGradient(-R, -R, R, R);
    g.addColorStop(0, '#f6dd92'); g.addColorStop(.35, '#b8892e'); g.addColorStop(.6, '#f0d27a'); g.addColorStop(1, '#7d5a1c');
    return g;
  }

  function buildStatic() {
    const [c, x] = layer();
    // 台の影
    x.save(); x.shadowColor = 'rgba(0,0,0,.65)'; x.shadowBlur = R * .09; x.shadowOffsetY = R * .035;
    x.beginPath(); x.arc(0, 0, R, 0, TAU); x.fillStyle = '#2a170a'; x.fill(); x.restore();
    // 木の外枠
    let g = x.createRadialGradient(-R * .3, -R * .35, R * .1, 0, 0, R);
    g.addColorStop(0, '#7a4a24'); g.addColorStop(.65, '#4a2a13'); g.addColorStop(1, '#22120a');
    x.beginPath(); x.arc(0, 0, R, 0, TAU); x.fillStyle = g; x.fill();
    x.lineWidth = 1;
    for (let k = 0; k < 9; k++) { x.beginPath(); x.arc(0, 0, R * (.94 + k * .0065), 0, TAU); x.strokeStyle = 'rgba(0,0,0,.09)'; x.stroke(); }
    // 真鍮の輪
    ringPath(x, R * .945, R * .925); x.fillStyle = goldGrad(x); x.fill();
    // 玉が走る溝（すり鉢状）
    g = x.createRadialGradient(0, 0, R * .8, 0, 0, R * .925);
    g.addColorStop(0, '#2e1b0d'); g.addColorStop(1, '#73492a');
    ringPath(x, R * .925, R * .8); x.fillStyle = g; x.fill();
    x.beginPath(); x.arc(0, 0, R * .87, -2.7, -1.25); x.lineWidth = R * .05; x.strokeStyle = 'rgba(255,240,220,.07)'; x.stroke();
    // 溝のダイヤ（玉を弾く飾り）
    for (let k = 0; k < 8; k++) {
      x.save(); x.rotate(k * TAU / 8 + TAU / 16); x.translate(R * .862, 0);
      if (k % 2) x.rotate(Math.PI / 2);
      x.beginPath(); x.moveTo(0, -R * .03); x.lineTo(R * .014, 0); x.lineTo(0, R * .03); x.lineTo(-R * .014, 0); x.closePath();
      x.fillStyle = goldGrad(x); x.fill(); x.restore();
    }
    x.beginPath(); x.arc(0, 0, R * .8, 0, TAU); x.lineWidth = R * .01; x.strokeStyle = '#120a05'; x.stroke();
    ringPath(x, R * .8, R * .775); x.fillStyle = '#1b100a'; x.fill();
    staticLayer = c;
  }

  function fitFont(x, text, maxW, from, min) {
    let s = from;
    for (; s > min; s -= .5) { x.font = '700 ' + s + 'px "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif'; if (x.measureText(text).width <= maxW) return text; }
    x.font = '700 ' + min + 'px "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif';
    let t = text;
    while (t.length > 1 && x.measureText(t + '…').width > maxW) t = t.slice(0, -1);
    return t === text ? t : t + '…';
  }

  function buildRotor() {
    const [c, x] = layer();
    const n = Math.max(opts.length, 2), empty = opts.length < 2, w = TAU / n;
    const RO = R * .775, RP = R * .665, RI = R * .33;
    for (let i = 0; i < n; i++) {
      const a0 = i * w - Math.PI / 2;
      x.beginPath(); x.arc(0, 0, RO, a0, a0 + w); x.arc(0, 0, RI, a0 + w, a0, true); x.closePath();
      x.fillStyle = empty ? '#2c302d' : colorFor(i, n); x.fill();
    }
    // 立体感と、ポケットの段差
    let g = x.createRadialGradient(0, 0, RI, 0, 0, RO);
    g.addColorStop(0, 'rgba(255,255,255,.10)'); g.addColorStop(1, 'rgba(0,0,0,.28)');
    ringPath(x, RO, RI); x.fillStyle = g; x.fill();
    ringPath(x, RO, RP); x.fillStyle = 'rgba(0,0,0,.22)'; x.fill();
    // 仕切り（金属のフレット）
    for (let i = 0; i < n; i++) {
      const a = i * w - Math.PI / 2, ca = Math.cos(a), sa = Math.sin(a);
      x.beginPath(); x.moveTo(ca * RI, sa * RI); x.lineTo(ca * RO, sa * RO); x.lineWidth = R * .006; x.strokeStyle = '#c9a24a'; x.stroke();
      x.beginPath(); x.moveTo(ca * RP, sa * RP); x.lineTo(ca * RO, sa * RO); x.lineWidth = R * .022; x.strokeStyle = '#a8812f'; x.stroke();
      x.lineWidth = R * .007; x.strokeStyle = '#f6e3a6'; x.stroke();
    }
    for (const [r, wd] of [[RO, .012], [RP, .006], [RI, .014]]) {
      x.beginPath(); x.arc(0, 0, r, 0, TAU); x.lineWidth = R * wd; x.strokeStyle = goldGrad(x); x.stroke();
    }
    // 選択肢の名前
    x.fillStyle = '#fbf8f1'; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.shadowColor = 'rgba(0,0,0,.5)'; x.shadowBlur = 3;
    if (empty) {
      // 何も書かれていないときは無地
    } else if (n <= 4) {
      const r = R * .5, maxW = Math.min(R * .5, 2 * r * Math.sin(w / 2) * .78);
      opts.forEach((txt, i) => {
        const m = (i + .5) * w - Math.PI / 2;
        x.save(); x.rotate(m + Math.PI / 2);
        const t = fitFont(x, txt, maxW, R * .12, R * .055);
        x.fillText(t, 0, -r); x.restore();
      });
    } else {
      const r0 = R * .35, r1 = R * .645, maxW = (r1 - r0) * .92;
      const maxH = Math.min(R * .095, R * .42 * w * .8);
      opts.forEach((txt, i) => {
        const m = (i + .5) * w - Math.PI / 2;
        x.save(); x.rotate(m);
        const t = fitFont(x, txt, maxW, maxH, Math.min(maxH, R * .048));
        x.fillText(t, (r0 + r1) / 2, 0); x.restore();
      });
    }
    x.shadowBlur = 0;
    // 真ん中の木の山と、真鍮の十字の飾り
    g = x.createRadialGradient(-RI * .25, -RI * .3, RI * .05, 0, 0, RI);
    g.addColorStop(0, '#9a6636'); g.addColorStop(1, '#3a200e');
    x.beginPath(); x.arc(0, 0, RI - R * .007, 0, TAU); x.fillStyle = g; x.fill();
    for (let k = 0; k < 6; k++) { x.beginPath(); x.arc(0, 0, RI * (.45 + k * .1), 0, TAU); x.lineWidth = 1; x.strokeStyle = 'rgba(0,0,0,.12)'; x.stroke(); }
    x.save(); x.shadowColor = 'rgba(0,0,0,.5)'; x.shadowBlur = R * .02; x.shadowOffsetY = R * .008;
    for (let k = 0; k < 4; k++) {
      x.save(); x.rotate(k * Math.PI / 2);
      x.beginPath(); x.moveTo(0, 0); x.lineTo(R * .2, 0); x.lineCap = 'round'; x.lineWidth = R * .03; x.strokeStyle = goldGrad(x); x.stroke();
      x.beginPath(); x.arc(R * .2, 0, R * .028, 0, TAU); x.fillStyle = goldGrad(x); x.fill();
      x.restore();
    }
    g = x.createRadialGradient(-R * .03, -R * .03, R * .01, 0, 0, R * .09);
    g.addColorStop(0, '#fff2c4'); g.addColorStop(.5, '#d4a94a'); g.addColorStop(1, '#6e4f17');
    x.beginPath(); x.arc(0, 0, R * .085, 0, TAU); x.fillStyle = g; x.fill();
    x.restore();
    rotorLayer = c;
  }

  function drawBall(a, r) {
    const bx = Math.cos(a) * r, by = Math.sin(a) * r, br = R * .03;
    ctx.beginPath(); ctx.ellipse(bx + br * .35, by + br * .55, br * 1.05, br * .8, 0, 0, TAU); ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fill();
    const g = ctx.createRadialGradient(bx - br * .35, by - br * .4, br * .1, bx, by, br);
    g.addColorStop(0, '#ffffff'); g.addColorStop(.6, '#e4e2dc'); g.addColorStop(1, '#8d8b86');
    ctx.beginPath(); ctx.arc(bx, by, br, 0, TAU); ctx.fillStyle = g; ctx.fill();
  }

  let ball = null;
  function draw() {
    if (!size) return;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, size, size);
    ctx.drawImage(staticLayer, 0, 0, size, size);
    ctx.save();
    ctx.translate(size / 2, size / 2);
    ctx.save(); ctx.rotate(rot);
    ctx.drawImage(rotorLayer, -size / 2, -size / 2, size, size);
    if (winner >= 0) {   // 当たった区切りを金色に光らせる
      const n = opts.length, w = TAU / n, a0 = winner * w - Math.PI / 2;
      const pulse = .55 + .45 * Math.sin((performance.now() - winAt) / 160);
      ctx.beginPath(); ctx.arc(0, 0, R * .775, a0, a0 + w); ctx.arc(0, 0, R * .33, a0 + w, a0, true); ctx.closePath();
      ctx.fillStyle = 'rgba(227,189,98,' + (.12 + .1 * pulse) + ')'; ctx.fill();
      ctx.shadowColor = 'rgba(227,189,98,.9)'; ctx.shadowBlur = R * .05;
      ctx.lineWidth = R * .014; ctx.strokeStyle = '#f3d68a'; ctx.stroke();
    }
    ctx.restore();
    const b = ball || (ballRel != null ? { a: rot + ballRel, r: R * .72 } : null);
    if (b) drawBall(b.a, b.r);
    ctx.restore();
  }

  function layout() {
    const st = $('stage');
    const s = Math.floor(Math.min(st.clientWidth, st.clientHeight));
    if (s <= 40 || s === size) return;
    size = s; dpr = Math.min(3, window.devicePixelRatio || 1); R = size / 2 - 3;
    cv.width = cv.height = Math.round(size * dpr);
    cv.style.width = cv.style.height = size + 'px';
    buildStatic(); buildRotor(); draw();
  }

  // ---------- 回す ----------
  const sectorOf = rel => Math.floor((((rel + Math.PI / 2) % TAU) + TAU) % TAU / (TAU / opts.length));

  function startSpin(omega) {
    const s = clamp((Math.abs(omega) - 3) / 22, 0, 1);   // はじく強さ（0〜1）
    const dir = Math.sign(omega) || 1;
    const D = 8 + 4 * s;               // 玉が落ちるまで 8〜12 秒
    const Dr = D + 2.5;                // ホイールはその少しあとまで回る
    const w0 = clamp(Math.abs(omega), 4, 16);
    const bs = 9 + 5 * s;              // 玉の速さ（ホイールと逆向き）
    const n = opts.length, w = TAU / n;
    const win = randInt(n);            // 当たりは先に公平に決める（はじき方では狙えない）
    const alpha = (win + .5 + (rand01() - .5) * .6) * w - Math.PI / 2;
    const p = 2.5;
    spin = { t0: performance.now(), D, Dr, dir, theta0: rot, A: w0 * Dr / 3, K: D * (w0 + bs) / p, p, alpha, win, lastB: 0, lastSec: null, dropped: false, landed: false };
    winner = -1; ballRel = null;
    $('result').innerHTML = ''; $('result').className = 'result';
    $('hint').textContent = '';
    SFX.whoosh(); SFX.rollStart();
    loop();
  }

  function frame(now) {
    raf = 0;
    let busy = false;
    if (spin) {
      const sp = spin, t = (now - sp.t0) / 1000;
      rot = sp.theta0 + sp.dir * sp.A * (1 - Math.pow(1 - Math.min(1, t / sp.Dr), 3));
      const RT = R * .885, RP = R * .72;
      if (t < sp.D) {
        const u = t / sp.D;
        const psi = sp.alpha + sp.dir * sp.K * Math.pow(1 - u, sp.p);
        let r = RT;
        if (t < sp.D - DROP) {
          SFX.rollSet(Math.pow(1 - u, 1.2));
        } else {
          if (!sp.dropped) { sp.dropped = true; SFX.rollStop(); }
          const v = (t - (sp.D - DROP)) / DROP, ph = BOUNCES * Math.pow(v, .75);
          r = RP + (RT - RP) * Math.pow(1 - v, 1.6) * Math.abs(Math.cos(Math.PI * ph));
          const b = Math.floor(ph + .5);
          if (b > sp.lastB) { sp.lastB = b; SFX.clack(.5 * (1 - v * .55)); }
          const sec = sectorOf(psi);
          if (sp.lastSec !== null && sec !== sp.lastSec) SFX.clack(.2);
          sp.lastSec = sec;
        }
        ball = { a: rot + psi, r };
      } else {
        if (!sp.landed) {
          sp.landed = true; ballRel = sp.alpha; ball = null;
          SFX.rollStop(); SFX.land();
          const idx = sp.win;
          setTimeout(() => showResult(idx), 450);
        }
      }
      busy = t < sp.Dr || !sp.landed;
      if (!busy) spin = null;
    }
    if (winner >= 0 && now - winAt < 3000) busy = true;
    draw();
    if (busy) raf = requestAnimationFrame(frame);
  }
  const loop = () => { if (!raf) raf = requestAnimationFrame(frame); };

  function showResult(i) {
    winner = i; winAt = performance.now();
    const r = $('result');
    r.innerHTML = '<span class="eyebrow">WINNER</span><span class="pick"><span class="chip"></span><b></b></span>';
    r.querySelector('.chip').style.background = colorFor(i, opts.length);
    r.querySelector('b').textContent = opts[i];
    r.className = 'result pop';
    $('hint').textContent = 'もう一度はじけば回し直し';
    SFX.win();
    loop();
  }

  function showIdle() {
    const r = $('result');
    r.className = 'result';
    if (opts.length < 2) {
      r.innerHTML = '<span class="msg">選択肢を2つ以上入れてね</span>';
      $('hint').textContent = '左上のリストを押して書き込む';
    } else {
      r.innerHTML = '';
      $('hint').textContent = 'ホイールを指ではじいて回す';
    }
  }

  // ---------- 指ではじく ----------
  function pt(e) {
    const b = cv.getBoundingClientRect();
    const x = e.clientX - b.left - b.width / 2, y = e.clientY - b.top - b.height / 2;
    return { a: Math.atan2(y, x), d: Math.hypot(x, y) };
  }
  cv.addEventListener('pointerdown', e => {
    SFX.unlock();
    if (spin || opts.length < 2) return;
    const p = pt(e);
    if (p.d < R * .1 || p.d > R) return;
    cv.setPointerCapture(e.pointerId);
    drag = { id: e.pointerId, last: p.a, acc: 0, rot0: rot, samples: [{ t: e.timeStamp, a: 0 }] };
  });
  cv.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    const p = pt(e);
    let d = p.a - drag.last;
    d = ((d + Math.PI) % TAU + TAU) % TAU - Math.PI;
    drag.acc += d; drag.last = p.a;
    rot = drag.rot0 + drag.acc;
    drag.samples.push({ t: e.timeStamp, a: drag.acc });
    while (drag.samples.length > 2 && e.timeStamp - drag.samples[0].t > 160) drag.samples.shift();
    draw();
  });
  function release(e) {
    if (!drag || e.pointerId !== drag.id) return;
    const sm = drag.samples, moved = Math.abs(drag.acc) > .05;
    drag = null;
    let omega = 0;
    const recent = sm.filter(s => e.timeStamp - s.t <= 110);
    if (recent.length >= 2) {
      const a = recent[0], b = recent[recent.length - 1], dt = (b.t - a.t) / 1000;
      if (dt > .008 && e.timeStamp - b.t < 80) omega = (b.a - a.a) / dt;
    }
    if (Math.abs(omega) >= 3) startSpin(omega);
    else if (moved) $('hint').textContent = 'もう少し強く、シュッとはじいて';
  }
  cv.addEventListener('pointerup', release);
  cv.addEventListener('pointercancel', release);

  // ---------- リストの編集 ----------
  const sheet = $('sheet'), backdrop = $('backdrop');
  function refreshWheel() {
    const next = optionsOf(cur());
    const same = next.length === opts.length && next.every((v, i) => v === opts[i]);
    $('list-label').textContent = cur().name || '名前なし';
    if (same) return;
    opts = next; winner = -1; ballRel = null;
    if (size) { buildRotor(); draw(); }
    showIdle();
  }
  function renderLists() {
    $('lists').replaceChildren(...S.lists.map(l => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'list-row';
      b.setAttribute('aria-current', String(l.id === S.current));
      const name = document.createElement('span'); name.textContent = l.name || '名前なし';
      const cnt = document.createElement('span'); cnt.textContent = optionsOf(l).length + '個';
      b.append(name, cnt);
      b.addEventListener('click', () => { S.current = l.id; save(); renderSheet(); });
      return b;
    }));
  }
  function renderItems() {
    const l = cur();
    $('name-input').value = l.name;
    $('items').replaceChildren(...l.items.map((v, i) => {
      const row = document.createElement('div'); row.className = 'item';
      const dot = document.createElement('i'); dot.style.background = colorFor(i, l.items.length);
      const inp = document.createElement('input');
      inp.type = 'text'; inp.id = 'item-' + i; inp.value = v; inp.maxLength = 24; inp.placeholder = '選択肢 ' + (i + 1); inp.autocomplete = 'off';
      inp.setAttribute('aria-label', '選択肢 ' + (i + 1));
      inp.addEventListener('input', () => { l.items[i] = inp.value; save(); renderLists(); });
      const del = document.createElement('button');
      del.type = 'button'; del.className = 'del'; del.textContent = '×'; del.setAttribute('aria-label', '選択肢 ' + (i + 1) + ' を消す');
      del.addEventListener('click', () => { l.items.splice(i, 1); if (l.items.length < 2) l.items.push(''); save(); renderItems(); renderLists(); });
      row.append(dot, inp, del);
      return row;
    }));
    $('add-item').disabled = l.items.length >= MAX;
    $('del-list').disabled = S.lists.length <= 1;
    disarm();
  }
  function renderSheet() { renderLists(); renderItems(); }
  function openSheet() {
    renderSheet();
    sheet.hidden = false; backdrop.hidden = false;
  }
  function closeSheet() {
    sheet.hidden = true; backdrop.hidden = true;
    refreshWheel();
  }
  $('list-btn').addEventListener('click', () => { if (!spin) openSheet(); });
  $('done').addEventListener('click', closeSheet);
  backdrop.addEventListener('click', closeSheet);
  $('name-input').addEventListener('input', e => { cur().name = e.target.value; save(); renderLists(); });
  $('add-item').addEventListener('click', () => {
    const l = cur();
    if (l.items.length >= MAX) return;
    l.items.push(''); save(); renderItems();
    const inp = $('item-' + (l.items.length - 1)); if (inp) inp.focus();
  });
  $('new-list').addEventListener('click', () => {
    const l = { id: uid(), name: '新しいリスト', items: ['', ''] };
    S.lists.push(l); S.current = l.id; save(); renderSheet();
    $('name-input').focus(); $('name-input').select();
  });
  let armTimer = 0;
  function disarm() { clearTimeout(armTimer); const b = $('del-list'); b.classList.remove('armed'); b.textContent = 'このリストを消す'; }
  $('del-list').addEventListener('click', () => {
    const b = $('del-list');
    if (S.lists.length <= 1) return;
    if (!b.classList.contains('armed')) {
      b.classList.add('armed'); b.textContent = 'もう一度押すと消える';
      armTimer = setTimeout(disarm, 3000);
      return;
    }
    S.lists = S.lists.filter(l => l.id !== S.current);
    S.current = S.lists[0].id; save(); renderSheet();
  });

  // ---------- 音のボタン ----------
  const soundBtn = $('sound');
  const paintSound = () => {
    soundBtn.setAttribute('aria-pressed', String(SFX.on));
    soundBtn.setAttribute('aria-label', SFX.on ? '音を消す' : '音を鳴らす');
  };
  soundBtn.addEventListener('click', () => { SFX.set(!SFX.on); paintSound(); SFX.tick(); });
  paintSound();

  // ---------- はじめ ----------
  opts = optionsOf(cur());
  $('list-label').textContent = cur().name || '名前なし';
  showIdle();
  layout();
  const relayout = () => { size = 0; layout(); };
  new ResizeObserver(relayout).observe($('stage'));
  addEventListener('resize', relayout);
  addEventListener('pageshow', relayout);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (size) { buildRotor(); draw(); } });

  // 確認用（ブラウザでの動作確認に使う）
  window.__roulette = {
    startSpin,
    step(sec) { if (spin) frame(spin.t0 + sec * 1000); },   // 時間を指定して1コマ進める
    get state() { return { opts, winner, spinning: !!spin, rot, ball, ballRel, win: spin && spin.win, D: spin && spin.D }; }
  };

  if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
})();
</script>
</body>
</html>
